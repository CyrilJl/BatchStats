[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batchstats"
version = "0.6"
description = "Online statistics for batched, streaming, and out-of-core NumPy data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cyril Joly" },
]
keywords = ["numpy", "online-algorithms", "statistics", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]
docs = [
    "sphinx>=7,<10",
    "sphinx-favicon>=1,<2",
    "sphinxawesome-theme>=5,<6",
]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.11,<1",
    "sphinx>=7,<10",
    "sphinx-favicon>=1,<2",
    "sphinxawesome-theme>=5,<6",
    "twine>=6,<8",
]

[project.urls]
Documentation = "https://batchstats.readthedocs.io"
Issues = "https://github.com/CyrilJl/BatchStats/issues"
Repository = "https://github.com/CyrilJl/BatchStats"

[tool.setuptools.packages.find]
include = ["batchstats*"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["batchstats"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/source/conf.py" = ["E501"]
